            js: `let alunos = [];
let idEditando = null;
let proximoId = 1;
const CHAVE = "alunos_degrau7_master";

function carregar() {
    const salvo = localStorage.getItem(CHAVE);
    if (salvo) {
        alunos = JSON.parse(salvo);
        proximoId = alunos.length ? Math.max(...alunos.map(a => a.id)) + 1 : 1;
    }
    listar();
}

function persistir() {
    localStorage.setItem(CHAVE, JSON.stringify(alunos));
}

function listar() {
    const tbody = document.getElementById("lista");
    tbody.innerHTML = "";
    alunos.forEach(a => {
        tbody.innerHTML += \`<tr>
            <td>\${a.id}</td><td>\${a.nome}</td><td>\${a.email}</td>
            <td>
                <button class="btn-acao btn-amarelo" onclick="editar(\${a.id})">Editar</button>
                <button class="btn-acao btn-vermelho" onclick="excluir(\${a.id})">Excluir</button>
            </td>
        </tr>\`;
    });
}

function salvar() {
    const n = document.getElementById("nome");
    const e = document.getElementById("email");
    if (!n.value) return alert("Preencha o nome!");

    if (idEditando) {
        const a = alunos.find(x => x.id === idEditando);
        a.nome = n.value;
        a.email = e.value;
        idEditando = null;
        document.getElementById("btnSalvar").innerText = "Salvar";
    } else {
        alunos.push({ id: proximoId++, nome: n.value, email: e.value });
    }

    n.value = e.value = "";
    persistir();
    listar();
}

function editar(id) {
    const a = alunos.find(x => x.id === id);
    document.getElementById("nome").value = a.nome;
    document.getElementById("email").value = a.email;
    idEditando = id;
    document.getElementById("btnSalvar").innerText = "Atualizar #" + id;
}

function excluir(id) {
    if (confirm("Excluir este aluno?")) {
        alunos = alunos.filter(a => a.id !== id);
        persistir();
        listar();
    }
}

function exportar() {
    const texto = JSON.stringify(alunos, null, 2);
    const blob = new Blob([texto], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "alunos.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
}

function importar(evento) {
    const arquivo = evento.target.files[0];
    if (!arquivo) return;

    const leitor = new FileReader();
    leitor.onload = () => {
        try {
            const dados = JSON.parse(leitor.result);
            if (!Array.isArray(dados)) throw new Error("O JSON precisa conter uma lista []");

            alunos = dados;
            proximoId = alunos.length ? Math.max(...alunos.map(a => a.id)) + 1 : 1;

            persistir();
            listar();
            alert("Sucesso! " + alunos.length + " alunos importados.");
        } catch (e) {
            alert("Falha ao importar: " + e.message);
        }
    };
    leitor.readAsText(arquivo);
}

function resetar() {
    if (!confirm("Tem certeza que deseja apagar todo o banco de dados local?")) return;
    localStorage.removeItem(CHAVE);
    alunos = [];
    proximoId = 1;
    listar();
}

carregar();`

   <span class="novo">document.getElementById("idade").value = a.idade || "";</span>
2. Em salvar() no ramo de edição (if idEditando):
   <span class="novo">a.idade = i.value;</span>
3. O LocalStorage, Exportar e Importar já acolhem o novo campo automaticamente!`,
            css: CSS_MINIMO_EXATO,
            html: `<div class="card-tela">
    <h3>Degrau 7: O Sistema Completo (Com I/O e Reset)</h3>

    <div class="linha-inputs">
        <input id="nome" placeholder="Nome">
        <input id="email" placeholder="E-mail">
        <input id="idade" type="number" placeholder="Idade">
        <button class="btn-acao btn-azul" id="btnSalvar" onclick="salvar()">Salvar</button>
    </div>

    <div class="linha-inputs barra-ferramentas">
        <button class="btn-acao btn-verde" onclick="exportar()">💾 Exportar</button>
        <label class="btn-acao btn-roxo">
            📂 Importar JSON
            <input type="file" accept=".json" onchange="importar(event)" style="display:none;">
        </label>
        <button class="btn-acao btn-vermelho" onclick="resetar()">🔄 Resetar Tudo</button>
    </div>

    <table class="tabela-dados">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Idade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>
</div>`,
            js: `let alunos = [];
let idEditando = null;
let proximoId = 1;
const CHAVE = "alunos_degrau7_master_com_idade";

function carregar() {
    const salvo = localStorage.getItem(CHAVE);
    if (salvo) {
        alunos = JSON.parse(salvo);
        proximoId = alunos.length ? Math.max(...alunos.map(a => a.id)) + 1 : 1;
    }
    listar();
}

function persistir() {
    localStorage.setItem(CHAVE, JSON.stringify(alunos));
}

function listar() {
    const tbody = document.getElementById("lista");
    tbody.innerHTML = "";
    alunos.forEach(a => {
        tbody.innerHTML += \`<tr>
            <td>\${a.id}</td>
            <td>\${a.nome}</td>
            <td>\${a.email}</td>
            <td>\${a.idade ?? "-"}</td>
            <td>
                <button class="btn-acao btn-amarelo" onclick="editar(\${a.id})">Editar</button>
                <button class="btn-acao btn-vermelho" onclick="excluir(\${a.id})">Excluir</button>
            </td>
        </tr>\`;
    });
}

function salvar() {
    const n = document.getElementById("nome");
    const e = document.getElementById("email");
    const i = document.getElementById("idade");

    if (!n.value) return alert("Preencha o nome!");

    if (idEditando) {
        const a = alunos.find(x => x.id === idEditando);
        a.nome  = n.value;
        a.email = e.value;
        a.idade = i.value; // ATUALIZAÇÃO DA IDADE
        idEditando = null;
        document.getElementById("btnSalvar").innerText = "Salvar";
    } else {
        alunos.push({ 
            id: proximoId++, 
            nome: n.value, 
            email: e.value, 
            idade: i.value // INCLUSÃO DA IDADE
        });
    }

    n.value = e.value = i.value = "";
    persistir();
    listar();
}

function editar(id) {
    const a = alunos.find(x => x.id === id);
    document.getElementById("nome").value  = a.nome;
    document.getElementById("email").value = a.email;
    document.getElementById("idade").value = a.idade || ""; // PREENCHE O INPUT DE IDADE
    idEditando = id;
    document.getElementById("btnSalvar").innerText = "Atualizar #" + id;
}

function excluir(id) {
    if (confirm("Excluir este aluno?")) {
        alunos = alunos.filter(a => a.id !== id);
        persistir();
        listar();
    }
}

function exportar() {
    const texto = JSON.stringify(alunos, null, 2);
    const blob = new Blob([texto], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "alunos.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
}

function importar(evento) {
    const arquivo = evento.target.files[0];
    if (!arquivo) return;

    const leitor = new FileReader();
    leitor.onload = () => {
        try {
            const dados = JSON.parse(leitor.result);
            if (!Array.isArray(dados)) throw new Error("O JSON precisa conter uma lista []");

            alunos = dados;
            proximoId = alunos.length ? Math.max(...alunos.map(a => a.id)) + 1 : 1;

            persistir();
            listar();
            alert("Sucesso! " + alunos.length + " alunos importados.");
        } catch (e) {
            alert("Falha ao importar: " + e.message);
        }
    };
    leitor.readAsText(arquivo);
}

function resetar() {
    if (!confirm("Tem certeza que deseja apagar todo o banco de dados local?")) return;
    localStorage.removeItem(CHAVE);
    alunos = [];
    proximoId = 1;
    listar();
}

carregar();`

    /* ============================================================

        COMPONENTES.filter(c => c.categoria === cat).forEach(comp => {

            btn.onclick = () => mostrarDegrau(comp.id);
            sidebarNav.appendChild(btn);

    const conteudoPrincipal = document.getElementById('conteudoPrincipal');

        fecharMenu();

        // EQUAÇÃO MATEMÁTICA EXATA: HTML + CSS + JS = htmlCompleto
        const htmlCompleto = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
${comp.css}
</style>
</head>
<body>
${comp.html}
<script>
${comp.js}
<\/script>
</body>
</html>`;

        htmlCompletoAtual = htmlCompleto;

                    <div>

                    </div>
                    <span class="preview-titulo">preview-${comp.id}.html</span>
                    <span></span>

                <iframe class="preview-iframe" id="previewIframe"></iframe>

                <pre>${escapeHtml(comp.html)}</pre>

                <button class="btn-copiar" onclick="copiarAba('aba-css', this)">📋 Copiar CSS</button>
                <pre>${escapeHtml(comp.css)}</pre>
            </div>
            <div class="bloco-codigo" id="aba-js">
                <button class="btn-copiar" onclick="copiarAba('aba-js', this)">📋 Copiar JS</button>

            <div class="bloco-codigo" id="aba-tudo">

        `;

        const iframe = document.getElementById('previewIframe');

        window.scrollTo({ top: 0, behavior: 'smooth' });

    function abrirEmNovaAba() {
        const blob = new Blob([htmlCompletoAtual], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
    }

    function trocarAba(btn, tipo) {
        document.querySelectorAll('.aba').forEach(b => b.classList.remove('ativa'));
        document.querySelectorAll('.bloco-codigo').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativa');
        document.getElementById('aba-' + tipo).classList.add('ativo');
    }

    function copiarAba(idAba, btn) {
        const texto = document.getElementById(idAba).querySelector('pre').innerText;
        navigator.clipboard.writeText(texto).then(() => {
            const orig = btn.textContent;
            btn.textContent = '✅ Copiado!';
            setTimeout(() => btn.textContent = orig, 1800);
        });
    }

    function escapeHtml(txt) {
        return txt
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function toggleMenu() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlayMenu');
        const aberto = sidebar.classList.contains('aberta');
        if (aberto) {
            sidebar.classList.remove('aberta');
            overlay.classList.remove('ativo');
        } else {
            sidebar.classList.add('aberta');
            overlay.classList.add('ativo');
        }
    }

    function fecharMenu() {
        document.getElementById('sidebar').classList.remove('aberta');
        document.getElementById('overlayMenu').classList.remove('ativo');
    }

    function voltarAoInicioPrincipal() {
        document.getElementById('inicioPrincipal').scrollIntoView({ behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
        const btn = document.getElementById('btnTopo');
        if (window.scrollY > 350) btn.classList.remove('oculto');
        else btn.classList.add('oculto');
