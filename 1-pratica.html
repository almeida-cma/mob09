        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* BOTÃO VOLTAR AO TOPO */
        .btn-topo {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: #0f172a;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(59,130,246,0.4);

            z-index: 1500;

            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .btn-topo:hover { transform: scale(1.1) translateY(-3px); }
        .btn-topo.oculto { opacity: 0; pointer-events: none; transform: scale(0.5); }

        /* BOTÃO MOBILE */
        .btn-menu-flutuante {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: #0f172a;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(59,130,246,0.4);
            transition: all 0.25s;
            z-index: 1400;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .btn-menu-flutuante:active { transform: scale(0.92); }

            top: -4px;
            right: -4px;
            background: #f59e0b;
            color: #000;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 10px;
            border: 2px solid #0f172a;
        }

        .overlay-menu {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;

            color: #64748b;
            font-size: 0.82rem;
            font-weight: 700;

            display: none;

            background: #020617;

            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #334155;

            right: 12px;
            background: #38bdf8;
            color: #042f2e;
            border: none;

            js: `const CHAVE = "meu_primeiro_teste";

function gravarDado() {
    const valor = document.getElementById("meuDado").value;

            js: `const CHAVE = "objeto_aluno_teste";

function salvarObjeto() {
    // Criamos o objeto JavaScript:
    const aluno = {
        nome: document.getElementById("txtNome").value,
        email: document.getElementById("txtEmail").value
    };

    // 1. Transformamos em texto com JSON.stringify():
    const textoJson = JSON.stringify(aluno);

    // 2. Gravamos o texto:
    localStorage.setItem(CHAVE, textoJson);

    document.getElementById("saidaJSON").innerText =
        "Texto cru armazenado no LocalStorage:\\n" + textoJson;
}

function recuperarObjeto() {
    // 1. Pegamos a string crua:
    const textoSalvo = localStorage.getItem(CHAVE);
    if (!textoSalvo) return alert("Nada salvo ainda!");

    // 2. Reconstruímos o objeto em memória com JSON.parse():
    const obj = JSON.parse(textoSalvo);

    document.getElementById("saidaJSON").innerText =
        "Objeto reconstruído pelo parse:\\n" +
        "Nome: " + obj.nome + "\\n" +
        "E-mail: " + obj.email;
}`

            js: `let alunos = [];
let proximoId = 1;

function adicionar() {
    const nomeInp = document.getElementById("nome");
    const emailInp = document.getElementById("email");

    if (!nomeInp.value || !emailInp.value) return alert("Preencha ambos os campos!");

    // Adiciona no array em memória
    alunos.push({
        id: proximoId++,
        nome: nomeInp.value,
        email: emailInp.value
    });

    nomeInp.value = "";
    emailInp.value = "";

    listar();
}

function listar() {
    const tbody = document.getElementById("lista");
    tbody.innerHTML = ""; // Limpa a tabela antes de redesenhar

    alunos.forEach(a => {
        tbody.innerHTML += \`<tr>
            <td>\${a.id}</td>
            <td>\${a.nome}</td>
            <td>\${a.email}</td>
        </tr>\`;
    });
}`

let idEditando = null;
let proximoId = 1;
const CHAVE = "alunos_degrau7_master";

function carregar() {
    const salvo = localStorage.getItem(CHAVE);
    if (salvo) {
        alunos = JSON.parse(salvo);
        proximoId = alunos.length ? Math.max(...alunos.map(a => a.id)) + 1 : 1;
    }
    listar();
}

function persistir() {
    localStorage.setItem(CHAVE, JSON.stringify(alunos));
}

function listar() {
    const tbody = document.getElementById("lista");
    tbody.innerHTML = "";
    alunos.forEach(a => {
        tbody.innerHTML += \`<tr>
            <td>\${a.id}</td><td>\${a.nome}</td><td>\${a.email}</td>
            <td>
                <button class="btn-acao btn-amarelo" onclick="editar(\${a.id})">Editar</button>
                <button class="btn-acao btn-vermelho" onclick="excluir(\${a.id})">Excluir</button>
            </td>
        </tr>\`;
    });
}

function salvar() {
    const n = document.getElementById("nome");
    const e = document.getElementById("email");
    if (!n.value) return alert("Preencha o nome!");

    if (idEditando) {
        const a = alunos.find(x => x.id === idEditando);
        a.nome = n.value;
        a.email = e.value;
        idEditando = null;
        document.getElementById("btnSalvar").innerText = "Salvar";
    } else {
        alunos.push({ id: proximoId++, nome: n.value, email: e.value });
    }

    n.value = e.value = "";
    persistir();
    listar();
}

function editar(id) {
    const a = alunos.find(x => x.id === id);
    document.getElementById("nome").value = a.nome;
    document.getElementById("email").value = a.email;
    idEditando = id;
    document.getElementById("btnSalvar").innerText = "Atualizar #" + id;
}

function excluir(id) {
    if (confirm("Excluir este aluno?")) {
        alunos = alunos.filter(a => a.id !== id);
        persistir();
        listar();
    }
}

function exportar() {
    const texto = JSON.stringify(alunos, null, 2);
    const blob = new Blob([texto], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "alunos.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
}

function importar(evento) {
    const arquivo = evento.target.files[0];
    if (!arquivo) return;

    const leitor = new FileReader();
    leitor.onload = () => {
        try {
            const dados = JSON.parse(leitor.result);
            if (!Array.isArray(dados)) throw new Error("O JSON precisa conter uma lista []");

            alunos = dados;
            proximoId = alunos.length ? Math.max(...alunos.map(a => a.id)) + 1 : 1;

            listar();
            alert("Sucesso! " + alunos.length + " alunos importados.");

            alert("Falha ao importar: " + e.message);
        }
    };
    leitor.readAsText(arquivo);
}

    alunos = [];
    proximoId = 1;
    listar();
}
